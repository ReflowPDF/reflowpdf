<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Generated Content Test: a leader whose after-content does not fit moves to the next line</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-content-3/#leaders">
<link rel="match" href="leader-wrap-001-ref.html">
<meta name="assert" content="css-content-3 §5.3 step 4: the before-content fills the first line, so the leader and the after-content go to the next line, where the leader fills from the line start to the after-content at the end edge. The font is GCPM Leaders, Ahem with a visible dot and underscore (in Ahem both are full squares).">
<link rel="stylesheet" href="/fonts/ahem.css">
<link rel="stylesheet" href="../support/leaders.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 "GCPM Leaders"; color: black; }
h1, h2, p, div, ol, ul, li, span, i, img { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
.l::after { content: leader(dotted); }
</style>
<p>ABCDEFGHIJ<span class="l"></span>KL</p>
