<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Generated Content Test: leader(space) is leader(" ")</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-content-3/#leader-function">
<link rel="match" href="leader-space-001-ref.html">
<meta name="assert" content="The space keyword pushes the end content to the end of the line with blank space (eight Ahem spaces here).">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
.l::after { content: leader(space); }
</style>
<p>AB<span class="l"></span>5</p>
