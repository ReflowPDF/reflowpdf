<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Generated Content Test: each line gets its own leader length</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-content-3/#leader-function">
<link rel="match" href="leader-per-line-001-ref.html">
<meta name="assert" content="css-content-3 §5.2: each leader fills the free space of its own line: nine dots after A on the first line, six after ABC on the second, before the end texts 5 and 12. The font is GCPM Leaders, Ahem with a visible dot and underscore (in Ahem both are full squares).">
<link rel="stylesheet" href="/fonts/ahem.css">
<link rel="stylesheet" href="../support/leaders.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 "GCPM Leaders"; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
.l::after { content: leader(dotted); }
</style>
<p>A<span class="l"></span>5</p>
<p>ABC<span class="l"></span>12</p>
