<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Reference: CSS Test: GCPM string-set on element with display: none</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="http://www.w3.org/TR/css-gcpm-3/#setting-named-strings-the-string-set-pro">
<!--WD of this spec is out of date; referencing the ED--><meta name="flags" content="paged">
<meta name="assert" content="Test checks that a string can be set to the value of an element even if display is set to none">
<style>
@page { size: 8.5in 11in; } /* ReflowPDF port: page size fixed to Letter, so the page count does not depend on the default page size */
@page { @top-center { content: "Chapter Title"; } }

  

 h1 {
display: none;
 }



</style>
</head>
<body>
<h1>Chapter Title</h1>
<p>Test passes if “Chapter Title” appears in the running head.</p>
</body>
</html>
