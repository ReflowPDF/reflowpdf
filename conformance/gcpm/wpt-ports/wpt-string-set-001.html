<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Test: GCPM string-set with string</title>
<link rel="author" title="Dave Cramer" href="mailto:dauwhe@gmail.com">
<link rel="help" href="http://www.w3.org/TR/css-gcpm-3/#setting-named-strings-the-string-set-pro">
<link rel="match" href="wpt-string-set-001-ref.html">
<!-- Ported from WPT css/css-gcpm/string-set-001.html (upstream: manual test without a reference). Reference authored by ReflowPDF per css-gcpm-3. -->

<meta name="flags" content="paged">
<meta name="assert" content="Test checks that a named string can be set to a string value.">
<style type="text/css">
@page { size: 8.5in 11in; } /* ReflowPDF port: page size fixed to Letter, so the page count does not depend on the default page size */
  @page {
   @top-center {
   content: string(title);
   }
  }

 h1 {
   string-set: title 'hello, world';
 }
</style>
</head>
<body>
<h1>Chapter Title</h1>
<p>Test passes if “hello, world” appears in the running head at the top of the page.</p>
</body>
</html>
