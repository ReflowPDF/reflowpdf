<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS GCPM Test: counter() inside string-set is evaluated at the element</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-gcpm/#setting-named-strings-the-string-set-pro">
<link rel="match" href="string-set-counter-001-ref.html">
<meta name="assert" content="string-set: hdr counter(sec) stores the section counter value of each h1; pages show i, ii, iii (lower-roman, so that a wrong value differs in length: in Ahem every digit is the same square).">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
h1 { counter-increment: sec; string-set: hdr counter(sec, lower-roman); }
@page { @top-center { content: string(hdr); } }
</style>
<h1>A</h1>
<h1 class="pb">B</h1>
<h1 class="pb">C</h1>
