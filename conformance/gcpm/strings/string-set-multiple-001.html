<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS GCPM Test: one declaration sets several named strings</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-gcpm/#setting-named-strings-the-string-set-pro">
<link rel="match" href="string-set-multiple-001-ref.html">
<meta name="assert" content="string-set: a content(), b attr(title) sets two strings from one element; the running head joins them: A TT. The values differ in length: in Ahem every letter is the same square.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
h1 { string-set: a content(), b attr(title); }
@page { @top-center { content: string(a) " " string(b); } }
</style>
<h1 title="TT">A</h1>
