<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS GCPM Test: string(name, start) is the entry value unless the element is first on the page</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-gcpm/#using-named-strings">
<link rel="match" href="string-start-001-ref.html">
<meta name="assert" content="css-gcpm-3 §1.1.2: with start, the value of the first assignment is used if the element is the first element on the page, otherwise the entry value. Page 1: the h1 A is the first element, so A; page 2: the entry value A; page 3: the h1 CCC follows a paragraph, so the entry value A, not CCC. The values differ in length: in Ahem every letter is the same square.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
h1 { string-set: hdr content(); }
@page { @top-center { content: string(hdr, start); } }
</style>
<h1>A</h1>
<p class="pb">B</p>
<p class="pb">X</p><h1>CCC</h1><h1>DDDD</h1>
