<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS GCPM Reference: string(name, last) is the exit value of the page</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 0 40px; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
.sheet + .sheet { break-before: page; }
.hdr, .ftr { height: 40px; line-height: 40px; text-align: center; }
.area { height: 120px; }
</style>
<div class="sheet"><div class="hdr">A</div><div class="area"><h1>A</h1></div></div>
<div class="sheet"><div class="hdr">A</div><div class="area"><p>B</p></div></div>
<div class="sheet"><div class="hdr">DDDD</div><div class="area"><p>X</p><h1>CCC</h1><h1>DDDD</h1></div></div>
