<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS GCPM Test: string(name, first-except) is empty on pages where the string is assigned</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-gcpm/#using-named-strings">
<link rel="match" href="string-first-except-001-ref.html">
<meta name="assert" content="first-except is identical to first except that the empty string is used on the page where the value is assigned: pages 1 and 3 assign, so they are empty; page 2 shows A.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
h1 { string-set: hdr content(); }
@page { @top-center { content: string(hdr, first-except); } }
</style>
<h1>A</h1>
<p class="pb">B</p>
<p class="pb">X</p><h1>C</h1><h1>D</h1>
