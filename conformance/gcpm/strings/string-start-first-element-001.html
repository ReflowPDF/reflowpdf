<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS GCPM Test: string(name, start) uses the assignment when the element is first on the page</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-gcpm/#using-named-strings">
<link rel="match" href="string-start-first-element-001-ref.html">
<meta name="assert" content="css-gcpm-3 §1.1.2: page 2 begins with the h1 that assigns BB, so with start the value is BB, not the entry value A. The values differ in length: in Ahem every letter is the same square.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
h1 { string-set: hdr content(); }
@page { @top-center { content: string(hdr, start); } }
</style>
<h1>A</h1>
<h1 class="pb">BB</h1>
<p class="pb">C</p>
