<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS GCPM Test: string(name, last) is the exit value of the page</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-gcpm/#using-named-strings">
<link rel="match" href="string-last-001-ref.html">
<meta name="assert" content="Page 3 assigns CCC then DDDD, and last yields DDDD; pages without assignments show the entry value A. The values differ in length: in Ahem every letter is the same square.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
h1 { string-set: hdr content(); }
@page { @top-center { content: string(hdr, last); } }
</style>
<h1>A</h1>
<p class="pb">B</p>
<p class="pb">X</p><h1>CCC</h1><h1>DDDD</h1>
