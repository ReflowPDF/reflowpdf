<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS GCPM Test: a footnote remainder that no content page can take gets a footnote-only page</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-gcpm/#footnote-area">
<link rel="match" href="footnote-overflow-page-001-ref.html">
<meta name="assert" content="css-gcpm-3 does not define how a footnote body that does not fit is laid out (§2.8: &quot;We need an algorithm for laying out footnotes&quot;). This test expects the body to be split: the eight-line body fills the five lines below its call on the only page of content, and the remaining three lines continue at the bottom of an appended page that holds only footnotes. §2.4.2 allows a page of footnotes only: max-height &quot;limits the size of this area, unless the page contains only footnotes&quot;.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span, i, img { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
.fn { float: footnote; }
::footnote-call { content: counter(footnote); vertical-align: baseline; font-size: 100%; line-height: inherit; font-variant-position: normal; }
::footnote-marker { content: none; }
::footnote-marker::after { content: none; }
@page { @footnote { margin: 0; padding: 0; border: none; } }
</style>
<p>X<span class="fn">AAAAAAAAAAA BBBBBBBBBBB CCCCCCCCCCC DDDDDDDDDDD EEEEEEEEEEE FFFFFFFFFFF GGGGGGGGGGG HHHHHHHHHHH</span></p>
