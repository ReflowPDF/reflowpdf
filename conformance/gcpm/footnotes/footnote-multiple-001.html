<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS GCPM Test: several footnotes stack in the footnote area in document order</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-gcpm/#footnotes">
<link rel="match" href="footnote-multiple-001-ref.html">
<meta name="assert" content="Two footnotes on one page get calls i and ii (lower-roman, so that the two numbers differ in length: in Ahem every digit is the same square) and two footnote bodies at the bottom of the page in document order, A above BBB (of different lengths, so that the order is visible). The footnote marker is suppressed (content: none), so that the test does not depend on where an engine places it.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
.fn { float: footnote; }
::footnote-call { content: counter(footnote, lower-roman); vertical-align: baseline; font-size: 100%; line-height: inherit; font-variant-position: normal; }
::footnote-marker { content: none; }
::footnote-marker::after { content: none; }
@page { @footnote { margin: 0; padding: 0; border: none; } }
</style>
<p>X<span class="fn">A</span>Y<span class="fn">BBB</span></p>
