<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS GCPM Test: a footnote body keeps the inline styles of its content</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-gcpm/#footnotes">
<link rel="match" href="footnote-styled-body-001-ref.html">
<meta name="assert" content="The footnote body is laid out as a block with its own inline content: the green span inside the footnote stays green in the footnote area (A, then a green B). The footnote marker is suppressed (content: none), so that the test does not depend on where an engine places it.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span, i, img { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
.fn { float: footnote; }
::footnote-call { content: counter(footnote); vertical-align: baseline; font-size: 100%; line-height: inherit; font-variant-position: normal; }
::footnote-marker { content: none; }
::footnote-marker::after { content: none; }
@page { @footnote { margin: 0; padding: 0; border: none; } }
</style>
<p>X<span class="fn">A<span style="color: green">B</span></span></p>
