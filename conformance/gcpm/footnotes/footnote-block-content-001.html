<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS GCPM Test: a footnote body keeps its inline content and wraps in the footnote area</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-gcpm/#footnotes">
<link rel="match" href="footnote-block-content-001-ref.html">
<meta name="assert" content="A footnote whose text is wider than the page area wraps inside the footnote area: AB CD EF GH fills the first line, IJ KL starts the second at the area edge; the area grows upward. The footnote marker is suppressed (content: none), so that the test does not depend on where an engine places it.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
.fn { float: footnote; }
::footnote-call { content: counter(footnote); vertical-align: baseline; font-size: 100%; line-height: inherit; font-variant-position: normal; }
::footnote-marker { content: none; }
::footnote-marker::after { content: none; }
@page { @footnote { margin: 0; padding: 0; border: none; } }
</style>
<p>X<span class="fn">AB CD EF GH IJ KL</span></p>
