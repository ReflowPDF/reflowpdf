<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS GCPM Test: a footnote body longer than a page makes a footnote-only page in the middle of the document</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-gcpm/#footnote-area">
<link rel="match" href="footnote-only-page-mid-001-ref.html">
<meta name="assert" content="css-gcpm-3 does not define how a footnote body that does not fit is laid out (§2.8: &quot;We need an algorithm for laying out footnotes&quot;). This test expects the body to be split: a 20-line body called on line 2 of an 8-line page takes the six lines below its call on page 1, fills page 2 (a page of footnotes only; the flow resumes on page 3) and shares page 3 with the flow (six lines of body, two of flow); the flow continues on page 4. §2.4.2 allows a page of footnotes only: max-height &quot;limits the size of this area, unless the page contains only footnotes&quot;.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 15px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 15px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span, i, img { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
.fn { float: footnote; }
::footnote-call { content: counter(footnote); vertical-align: baseline; font-size: 100%; line-height: inherit; font-variant-position: normal; }
::footnote-marker { content: none; }
::footnote-marker::after { content: none; }
@page { @footnote { margin: 0; padding: 0; border: none; } }
</style>
<p>AAAA</p>
<p>BB<span class="fn">a1<br>a2<br>a3<br>a4<br>a5<br>a6<br>b1<br>b2<br>b3<br>b4<br>b5<br>b6<br>b7<br>b8<br>c1<br>c2<br>c3<br>c4<br>c5<br>c6</span></p>
<p>CCCC</p>
<p>DDDD</p>
<p>EEEE</p>
<p>FFFF</p>
<p>GGGG</p>
