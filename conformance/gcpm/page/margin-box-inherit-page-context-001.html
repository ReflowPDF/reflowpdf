<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Paged Media Test: margin boxes inherit color from the page context</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-page-3/#page-properties">
<link rel="match" href="margin-box-inherit-page-context-001-ref.html">
<meta name="assert" content="A property set in the @page rule (the page context) is inherited by its margin boxes: color: green on @page makes the top-center content green.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
@page { color: green; @top-center { content: "X"; } }
</style>
<p>M</p>
