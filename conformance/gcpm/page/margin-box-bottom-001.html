<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Paged Media Test: bottom-left / bottom-center / bottom-right boxes with explicit alignment</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-page-3/#margin-boxes">
<link rel="match" href="margin-box-bottom-001-ref.html">
<meta name="assert" content="The bottom boxes mirror the top boxes; vertical-align: bottom puts the glyph at the bottom edge of the page.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
@page {
       @bottom-left { content: "X"; text-align: left; vertical-align: bottom; }
       @bottom-center { content: "X"; text-align: center; vertical-align: bottom; }
       @bottom-right { content: "X"; text-align: right; vertical-align: bottom; }
     }
</style>
<p>M</p>
