<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Paged Media Test: counter(pages) is the total number of pages on every page</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-page-3/#page-based-counters">
<link rel="match" href="pages-total-001-ref.html">
<meta name="assert" content="counter(pages) resolves to the total page count on each page. The values are lower-roman, so that a wrong number differs from the right one in length: in Ahem every digit is the same square.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
@page { @bottom-center { content: counter(page, lower-roman) " of " counter(pages, lower-roman); } }
</style>
<p>A</p>
<p class="pb">B</p>
<p class="pb">C</p>
