<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Paged Media Test: a change of page name forces a page break</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-page-3/#using-named-pages">
<link rel="match" href="named-page-break-001-ref.html">
<meta name="assert" content="Two consecutive blocks with different page names are placed on different pages even without an explicit break.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
.a { page: one; } .b { page: two; }
</style>
<p class="a">A</p>
<p class="b">B</p>
