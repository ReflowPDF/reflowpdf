<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Paged Media Test: :blank matches a page inserted by break-before: right</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-page-3/#blank-pseudo">
<link rel="match" href="page-selector-blank-001-ref.html">
<meta name="assert" content="break-before: right on the second block forces an empty left page 2; :blank selects it and its margin box shows the blank-page content instead of the default.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
@page { @top-center { content: "X"; } }
@page :blank { @top-center { content: "XXX"; } }
.r { break-before: right; }
</style>
<p>A</p>
<p class="r">C</p>
