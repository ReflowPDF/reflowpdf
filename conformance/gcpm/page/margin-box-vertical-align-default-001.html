<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Paged Media Test: margin box content is vertically centered by default</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-page-3/#margin-text-alignment">
<link rel="match" href="margin-box-vertical-align-default-001-ref.html">
<meta name="assert" content="The initial vertical-align of a page-margin box is middle: a one-line glyph in a 40px top margin sits 10px below the page top.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
@page { @top-center { content: "X"; } }
</style>
<p>M</p>
