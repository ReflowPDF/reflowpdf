<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Paged Media Reference: margin box content is vertically centered by default</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
@page { margin: 0; }
body { margin: 40px; }
.a { position: absolute; width: 20px; height: 20px; }
</style>
<p>M</p>
<div class="a" style="left:140px;top:10px">X</div>
