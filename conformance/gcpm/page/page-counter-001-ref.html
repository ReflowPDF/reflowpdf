<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Paged Media Reference: counter(page) in a margin box counts pages from 1</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 0 40px; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
.sheet + .sheet { break-before: page; }
.hdr, .ftr { height: 40px; line-height: 40px; text-align: center; }
.area { height: 120px; }
</style>
<div class="sheet"><div class="hdr"></div><div class="area"><p>A</p></div><div class="ftr">i</div></div>
<div class="sheet"><div class="hdr"></div><div class="area"><p>B</p></div><div class="ftr">ii</div></div>
<div class="sheet"><div class="hdr"></div><div class="area"><p>C</p></div><div class="ftr">iii</div></div>
