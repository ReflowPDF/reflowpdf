<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Generated Content Reference: page references work forwards and backwards (lower-roman)</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
a::after { content: "iii"; }
#t a::after { content: "i"; }
</style>
<p id="s">P<a href="#t"></a></p>
<p class="pb">B</p>
<p class="pb" id="t">T<a href="#s"></a></p>
