<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Generated Content Test: target-counter(…, page) prints the page counter, not the sheet index</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-content-3/#target-counter">
<link rel="help" href="https://drafts.csswg.org/css-page-3/#page-based-counters">
<link rel="match" href="target-counter-page-counter-reset-001-ref.html">
<meta name="assert" content="@page :first resets the page counter to 7, so the sheets are numbered 8, 9, 10 (reset, then the implied increment, CSS 2.1 §12.4); a link to an element on the third sheet shows x (10 in lower-roman): the value of the page counter at the target. The wrong values differ in length: ix without the increment on the first sheet, iii for the sheet number.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
@page :first { counter-reset: page 7; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
a::after { content: target-counter(attr(href url), page, lower-roman); }
</style>
<p>P<a href="#t"></a></p>
<p class="pb">B</p>
<p class="pb" id="t">T</p>
