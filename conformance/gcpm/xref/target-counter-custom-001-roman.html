<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Generated Content Test: target-counter() reads an author counter at the target (lower-roman)</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-content-3/#target-counter">
<link rel="match" href="target-counter-custom-001-roman-ref.html">
<meta name="assert" content="The target is the second h2 (counter sec = 2): the link text shows ii. The value is in lower-roman, so that a wrong value differs in length: in Ahem every digit is the same square.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
h2 { counter-increment: sec; }
a::after { content: target-counter(attr(href url), sec, lower-roman); }
</style>
<p>P<a href="#t"></a></p>
<h2>A</h2>
<h2 id="t">B</h2>
