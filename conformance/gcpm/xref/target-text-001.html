<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Generated Content Test: target-text() copies the text of the target</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-content-3/#target-text">
<link rel="match" href="target-text-001-ref.html">
<meta name="assert" content="css-content-3 §6.3: target-text() with the default content gives the text content of the referenced element, TTT. The values differ in length: in Ahem every letter is the same square.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
a::after { content: target-text(attr(href url)); }
</style>
<p>P<a href="#t"></a></p>
<p class="pb">B</p>
<p class="pb" id="t">TTT</p>
