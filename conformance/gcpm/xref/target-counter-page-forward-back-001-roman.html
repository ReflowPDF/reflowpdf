<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Generated Content Test: page references work forwards and backwards (lower-roman)</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-content-3/#target-counter">
<link rel="match" href="target-counter-page-forward-back-001-roman-ref.html">
<meta name="assert" content="A link on page 3 back to page 1 shows i; a link on page 1 forward to page 3 shows iii. The value is in lower-roman, so that a wrong value differs in length: in Ahem every digit is the same square.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
a::after { content: target-counter(attr(href url), page, lower-roman); }
</style>
<p id="s">P<a href="#t"></a></p>
<p class="pb">B</p>
<p class="pb" id="t">T<a href="#s"></a></p>
