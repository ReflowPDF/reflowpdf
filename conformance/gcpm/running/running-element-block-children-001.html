<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS GCPM Test: a running element with block children is rendered as a whole</title>
<link rel="author" title="ReflowPDF" href="https://reflowpdf.com">
<link rel="help" href="https://drafts.csswg.org/css-gcpm/#running-elements">
<link rel="match" href="running-element-block-children-001-ref.html">
<meta name="assert" content="The running element is a box with two block children; element() renders both lines in the margin box (top margin enlarged to fit).">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
@page { size: 300px 200px; margin: 40px; font: 20px/1 Ahem; }
html, body { margin: 0; padding: 0; }
body { font: 20px/1 Ahem; color: black; }
h1, h2, p, div, ol, ul, li, span { margin: 0; padding: 0; font: inherit; }
.pb { break-before: page; }
@page { margin-top: 60px; }
.hdr { position: running(hdr); text-align: center; }
@page { @top-center { content: element(hdr); vertical-align: top; } }
</style>
<div class="hdr"><p>H</p><p>K</p></div>
<p>A</p>
